name: Keep Supabase Awake

on:
  schedule:
    # Runs at 00:00 UTC every Monday and Thursday
    - cron: '0 0 * * 1,4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ping Supabase
        env:
          SUPABASE_URL: "https://lffxkhqwyvgpqkkqhznm.supabase.co"
          SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxmZnhraHF3eXZncHFra3Foem5tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM2NzE4NTIsImV4cCI6MjEwOTI0Nzg1Mn0.976G_PgCYpboqWxY-chNLIiyAnIpxL0t4VAgEkWvdFok"
        run: |
          CLEAN_URL="${SUPABASE_URL%/}"
          echo "Pinging ${CLEAN_URL}/auth/v1/health ..."
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            "${CLEAN_URL}/auth/v1/health" \
            -H "apikey: ${SUPABASE_ANON_KEY}")
          echo "HTTP Status: $response"

      - name: Auto-commit to reset GitHub 60-day inactivity timer
        run: |
          date -u +"Last active: %Y-%m-%d %H:%M:%S UTC" > .keepalive
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          # [skip ci] prevents Vercel from triggering a rebuild on every ping
          git commit -m "chore: keep alive [skip ci]" || exit 0
          git push
          
