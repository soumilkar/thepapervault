name: Keep Supabase Awake

on:
  schedule:
    - cron: '0 0 * * 1,4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: "https://lffxkhqwyvgpqkkqhznm.supabase.co"
          SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxmZnhraHF3eXZncHFra3Foem5tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM2NzE4NTIsImV4cCI6MjEwOTI0Nzg1Mn0.976G_PgCYpboqWxY-chNLIiyAnIpxL0t4VAgEkWvdFok"
        run: |
          # Remove any accidental trailing slash from SUPABASE_URL
          CLEAN_URL="${SUPABASE_URL%/}"
          
          echo "Pinging ${CLEAN_URL}/auth/v1/health ..."
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            "${CLEAN_URL}/auth/v1/health" \
            -H "apikey: ${SUPABASE_ANON_KEY}")
          
          echo "HTTP Status: $response"
          if [ "$response" -ne 200 ] && [ "$response" -ne 204 ]; then
            echo "Auth health returned $response, trying REST root..."
            response=$(curl -s -o /dev/null -w "%{http_code}" \
              "${CLEAN_URL}/rest/v1/" \
              -H "apikey: ${SUPABASE_ANON_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
            echo "REST HTTP Status: $response"
          fi
